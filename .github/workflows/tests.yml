name: tests

on:
  push:
    branches: [main, ci-tests]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install flask requests pypdf python-docx openpyxl
      # One step per suite so a failure names its suite in the run summary.
      - name: auth
        run: python3 tests/test_auth.py
      - name: tenancy
        if: ${{ !cancelled() }}
        run: python3 tests/test_tenancy.py
      - name: invite
        if: ${{ !cancelled() }}
        run: python3 tests/test_invite.py
      - name: harden
        if: ${{ !cancelled() }}
        run: python3 tests/test_harden.py
      - name: effort
        if: ${{ !cancelled() }}
        run: python3 tests/test_effort.py
      - name: summarize
        if: ${{ !cancelled() }}
        run: python3 tests/test_summarize.py
      - name: cost
        if: ${{ !cancelled() }}
        run: python3 tests/test_cost.py
      - name: backend-kinds
        if: ${{ !cancelled() }}
        run: python3 tests/test_backend_kinds.py
      - name: compare
        if: ${{ !cancelled() }}
        run: python3 tests/test_compare.py
      - name: compare-thinking
        if: ${{ !cancelled() }}
        run: python3 tests/test_compare_thinking.py
      - name: truncation
        if: ${{ !cancelled() }}
        run: python3 tests/test_truncation.py
      - name: agent-loop
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_loop.py
      - name: agent-routes
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_routes.py
      - name: agent-ssh
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_ssh.py
      - name: agent-coder
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_coder.py
      - name: agent-preview
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_preview.py
      - name: agent-projects
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_projects.py
      - name: agent-local
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_local.py
      - name: agent-budget
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_budget.py
      - name: agent-verify
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_verify.py
      - name: agent-prompthelp
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_prompthelp.py
      - name: agent-dialect
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_dialect.py
      - name: agent-context
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_context.py
      - name: agent-notes
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_notes.py
      - name: agent-symlink
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_symlink.py
      - name: agent-toolcalls
        if: ${{ !cancelled() }}
        run: python3 tests/test_agent_toolcalls.py
      - name: think-routes
        if: ${{ !cancelled() }}
        run: python3 tests/test_think_routes.py
      - name: project-guard
        if: ${{ !cancelled() }}
        run: python3 tests/test_project_guard.py
      - name: nested-fences
        if: ${{ !cancelled() }}
        run: python3 tests/test_nested_fences.py
      - name: delete-protocol
        if: ${{ !cancelled() }}
        run: python3 tests/test_delete_protocol.py
      - name: conflict-markers
        if: ${{ !cancelled() }}
        run: python3 tests/test_conflict_markers.py
      - name: history-budget
        if: ${{ !cancelled() }}
        run: python3 tests/test_history_budget.py
      - name: conversation-memory
        if: ${{ !cancelled() }}
        run: python3 tests/test_conversation_memory.py
      - name: web-search
        if: ${{ !cancelled() }}
        run: python3 tests/test_web_search.py
      - name: health-check
        if: ${{ !cancelled() }}
        run: python3 tests/test_health_check.py
      - name: mode-switcher
        if: ${{ !cancelled() }}
        run: python3 tests/test_mode_switcher.py
      - name: search-rewrite
        if: ${{ !cancelled() }}
        run: python3 tests/test_search_rewrite.py
      - name: search-recent
        if: ${{ !cancelled() }}
        run: python3 tests/test_search_recent.py
