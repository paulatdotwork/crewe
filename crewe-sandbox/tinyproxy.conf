Port 8888
Listen 0.0.0.0
Timeout 600

# Only in-cluster (RFC1918) clients may use the proxy. The sandbox reaches it
# over the internal docker network; nothing else can.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 172.16.0.0/12
Allow 10.0.0.0/8

# Default-deny: a host is reachable ONLY if it matches the filter file.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterCaseSensitive Off

# HTTPS (CONNECT) is allowed only to 443 — and still host-filtered above.
ConnectPort 443

LogLevel Info
